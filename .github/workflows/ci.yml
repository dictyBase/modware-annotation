name: Continuous integration
on:
  push:
    branches:
      - develop
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      arangodb:
        image: arangodb:3.11
        env:
          ARANGO_ROOT_PASSWORD: rootpass
        ports:
          - 8529/tcp
    steps:
      - name: check out code
        uses: actions/checkout@v6
      - name: set up golang
        uses: actions/setup-go@v6
        with:
          go-version: '~1.25'
      - run: go version
      - name: unit test
        run: go test -covermode=atomic -coverprofile=coverage.txt ./...
        env:
          ARANGO_USER: root
          ARANGO_PASS: rootpass
          ARANGO_HOST: localhost
          ARANGO_PORT: ${{ job.services.arangodb.ports[8529] }}
      - name: upload coverage to codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV }}
  call-build-deploy:
    needs: test
    uses: dictyBase/workflows/.github/workflows/composite-deploy.yaml@develop
    secrets: inherit
    with:
      app: annotation
      project: modware-annotation
      stack: experiments
      repository: ${{ github.repository }}
      ref: ${{ github.ref_name }}
      dockerfile: build/package/Dockerfile
      docker_image: modware-annotation
      cluster: ${{ vars.DEV_STAGING_CLUSTER }}
      cluster_state_storage: ${{ vars.DEV_STAGING_KOPS_STATE_STORAGE }}
  call-buildless-deploy:
    needs: call-build-deploy
    uses: dictyBase/workflows/.github/workflows/deploy-buildless-backend.yaml@develop
    secrets: inherit
    with:
      app: annotation-feature
      project: modware-annotation-feature
      stack: experiments
      repository: ${{ github.repository }}
      ref: ${{ github.ref_name }}
      dockerfile: build/package/Dockerfile
      docker_image: modware-annotation
      cluster: ${{ vars.DEV_STAGING_CLUSTER }}
      cluster_state_storage: ${{ vars.DEV_STAGING_KOPS_STATE_STORAGE }}
